[workspace]
resolver = "2"
members = [
    "apps/api",
    "apps/worker",
    "crates/core",
    "crates/engine",
    "crates/storage",
    "crates/billing",
    "crates/mailer",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["Detag Contributors"]
homepage = "https://github.com/ddsha441981/detag"
repository = "https://github.com/ddsha441981/detag"

[workspace.dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time", "sync", "net", "io-util"] }
futures-core = "0.3"
libc = "0.2"
prometheus = { version = "0.14", features = ["process"] }
opentelemetry = "0.30"
opentelemetry_sdk = { version = "0.30", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.30", features = ["http-proto"] }
tracing-opentelemetry = "0.31"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
uuid = { version = "1", features = ["v7", "serde"] }
axum = { version = "0.8", features = ["json"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors", "limit"] }
chrono = { version = "0.4", features = ["serde"] }
figment = { version = "0.10", features = ["env", "toml"] }
url = { version = "2", features = ["serde"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "migrate", "macros", "chrono", "uuid", "json"] }
deadpool-redis = { version = "0.22", features = ["rt_tokio_1", "script"] }
aws-sdk-s3 = "1"
aws-smithy-types = "1"
sha2 = "0.11"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
