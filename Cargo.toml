[workspace]
resolver = "2"
members = [
    "apps/api",
    "apps/gc",
    "apps/worker",
    "crates/core",
    "crates/engine",
    "crates/storage",
    "crates/validator",
    "crates/billing",
    "crates/mailer",
    "crates/testkit",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["Detag Contributors"]
homepage = "https://github.com/ddsha441981/detag"
repository = "https://github.com/ddsha441981/detag"

[workspace.dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time", "sync", "net", "io-util", "fs"] }
futures-core = "0.3"
libc = "0.2"
prometheus = { version = "0.14", features = ["process"] }
opentelemetry = "0.30"
opentelemetry_sdk = { version = "0.30", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.30", features = ["http-proto"] }
tracing-opentelemetry = "0.31"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
uuid = { version = "1", features = ["v7", "serde"] }
axum = { version = "0.8", features = ["json"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors", "limit"] }
chrono = { version = "0.4", features = ["serde"] }
figment = { version = "0.10", features = ["env", "toml"] }
url = { version = "2", features = ["serde"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "migrate", "macros", "chrono", "uuid", "json"] }
deadpool-redis = { version = "0.22", features = ["rt_tokio_1", "script"] }
aws-sdk-s3 = "1"
aws-smithy-types = "1"
testcontainers = "0.28"
insta = { version = "1.49", features = ["json"] }
proptest = "1"
criterion = { version = "0.7", features = ["html_reports"] }
image = "0.25"
jsonwebtoken = { version = "11", default-features = false, features = ["aws_lc_rs"] }
sha2 = "0.11"
base64 = "0.22"
argon2 = { version = "0.5", features = ["rand"] }
rand_core = { version = "0.6", features = ["getrandom"] }
utoipa = { version = "6", features = ["axum_extras", "uuid", "chrono"] }
utoipa-swagger-ui = { version = "10", features = ["axum"] }
apalis = "0.6"
apalis-redis = "0.6"
zxcvbn = "3"
sha1 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
lettre = { version = "0.11", default-features = false, features = ["tokio1", "smtp-transport", "tokio1-rustls-tls", "hostname", "builder", "pool"] }
tera = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
