# Conventional-commit lint (P0-006, NFR-52).
#
# Every commit must be a conventional commit carrying its ticket id and an
# FR/NFR trace, e.g.:
#   feat(auth): P1-014 refresh token rotation with reuse detection
# The linter itself is scripts/lint_commits.py (stdlib only, unit-tested in
# scripts/test_lint_commits.py). Scope vocabulary lives in CONTRIBUTING.md.
name: Commits

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-commits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Lint commit messages
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RANGE="${{ github.event.pull_request.base.sha }}..HEAD"
          else
            BEFORE="${{ github.event.before }}"
            if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              # First push to a new branch: only the head commit exists in range.
              python3 scripts/lint_commits.py --single HEAD
              exit 0
            fi
            RANGE="$BEFORE..${{ github.sha }}"
          fi
          echo "Linting range: $RANGE"
          python3 scripts/lint_commits.py --range "$RANGE"

      # CI-FAIL-013: the discover run covers every test_*.py in scripts/,
      # and several of them need third-party modules (test_fixtures_gen ->
      # numpy, test_templates_gen -> Pillow, the yaml-importing check
      # scripts -> PyYAML; CI-FAIL-020). The runner's system python
      # (3.14) has none of them, and numpy 1.26.4 has no 3.14 wheels — so
      # pin python 3.12 (same as the verify job) and install the three deps.
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install script-test deps
        run: python3 -m pip install --quiet "pillow==10.2.0" "numpy==1.26.4" "pyyaml==6.0.2"

      - name: Unit-test the linter
        run: python3 -m unittest discover -s scripts -p "test_*.py" -v
