# CI (P0-007 cargo-deny, P0-008 gitleaks, P0-013 verify pipeline).
#
# Jobs:
# - cargo-deny: RUSTSEC advisories + the license allow-list in deny.toml.
# - gitleaks: secret scan of the full history on every push / PR.
# - verify: fmt + clippy -D warnings + tests under postgres+redis service
#   containers, with JUnit XML + llvm-cov coverage uploaded as artifacts.
#   Tests run with cargo-nextest (same test binaries as `cargo test`,
#   plus JUnit output — stable `cargo test` cannot emit JUnit without
#   nightly). Coverage floors (05-QUALITY/01-test-strategy.md) are
#   reported, not enforced, until the suites exist to measure them.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  cargo-deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: EmbarkStudios/cargo-deny-action@v2

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pf
          POSTGRES_PASSWORD: pf
          POSTGRES_DB: pf
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PF_DATABASE_URL: postgres://pf:pf@localhost:5432/pf
      PF_REDIS_URL: redis://localhost:6379
      # sqlx `query!` macros compile offline from the checked-in
      # `.sqlx/` data (P0-041); the prepare --check step below still
      # connects live via DATABASE_URL.
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy (-D warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: env-check (.env.example drift)
        run: python3 scripts/env_check.py
      - name: config-table-check (generated settings table drift)
        run: python3 scripts/gen_config_table.py --check
      - name: schema-docs-check (migrations vs data-model table list)
        run: python3 scripts/check_schema_docs.py
      - name: dashboards-check (Grafana JSON + provisioning)
        run: python3 scripts/validate_dashboards.py
      - name: prometheus-check (config + alert rules)
        run: python3 scripts/validate_prometheus.py
      - name: Install just (task runner, needed by the steps below)
        uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: openapi-check (committed spec matches generated, P0-067)
        run: just openapi-check
      - name: route-table-check (committed route table matches generated, P0-074)
        run: just route-table-check
      - name: compose-db-check (Postgres compose file validates)
        run: just compose-db-check
      - name: compose-redis-check (Redis compose file validates)
        run: just compose-redis-check
      - name: migrate (clean migrate on the empty CI database, twice for idempotency)
        run: |
          just migrate
          just migrate
      - name: Install sqlx-cli (offline query metadata freshness, P0-037)
        run: cargo install sqlx-cli --version 0.9.0 --locked --no-default-features --features postgres,rustls
      - name: sqlx prepare --check (checked-in .sqlx/ matches the queries)
        run: DATABASE_URL=$PF_DATABASE_URL cargo sqlx prepare --workspace --check
      - name: Install nextest + llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest, cargo-llvm-cov
      - name: Test (JUnit)
        run: cargo nextest run --workspace --profile ci
      - name: Coverage (llvm-cov)
        run: |
          mkdir -p target/llvm-cov
          cargo llvm-cov --workspace --lcov --output-path target/llvm-cov/lcov.info
      - name: Upload test results + coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            target/junit.xml
            target/llvm-cov/lcov.info
          retention-days: 30
