# cargo-deny configuration (P0-007, NFR-52). cargo-deny 0.20.2.
#
# Policy:
# - Advisories: RUSTSEC vulnerability advisories are errors (cargo-deny
#   0.20 has no severity knob for them — they always fail `check` unless
#   listed in `ignore` with a reason). Yanked crates are denied.
# - Licenses: only the permissive set in `allow` is accepted. cargo-deny
#   denies any license not in `allow` by default, so server-side copyleft
#   (AGPL) is denied without needing an explicit list. A crate
#   dual-licensed "X OR Y" passes when any one of its licenses is allowed.
# - Sources: only crates.io; a git dependency needs an explicit exception
#   (add it here with a comment + ADR) — none exist today.
#
# Run locally: `just deny` (or `cargo deny check`).

[advisories]
# Yanked crates must not enter the tree.
yanked = "deny"
# Unmaintained advisories error for every crate in the graph (upstream
# default scope). If one fires on a transitive crate we cannot fix, add
# its id to `ignore` below with a reason — do not weaken this.
unmaintained = "all"
# Unsound advisories error for workspace crates only (upstream default).
unsound = "workspace"
# Ignored advisories (each needs a reason). Every entry below is a
# transitive crate with NO upgrade path at the latest ecosystem
# version on 13 Nov 2026 — verified by updating the parent to latest
# (aws-sdk-s3 1.159.0, testcontainers 0.28.0, image 0.25.10) and
# re-running `cargo deny check`. A new advisory on any crate — or a
# new version of any of these crates — still fails the build; these
# ignores are pinned to the advisory IDs, not the crates. Remove an
# entry as soon as its removal condition is met; the weekly audit job
# re-checks the tree every Monday, so a newly available fix surfaces
# within a week.
ignore = [
    # RUSTSEC-2026-0440 — astral-tokio-tar 0.6.4 unmaintained (via
    # testcontainers 0.28.0, dev-only: testkit + api/storage dev-deps).
    # testcontainers is already at latest (0.28.0); no newer version
    # drops the crate. Remove when testcontainers ships a release
    # without astral-tokio-tar.
    "RUSTSEC-2026-0440",
    # RUSTSEC-2024-0436 — paste 1.0.15 unmaintained (via image 0.25.10
    # -> ravif 0.13.0 -> rav1e 0.8.1; dev-only: engine benches).
    # image is already at latest 0.25.10. paste has no known
    # vulnerability — unmaintained only. Remove when image's ravif
    # chain stops depending on paste.
    "RUSTSEC-2024-0436",
    # RUSTSEC-2026-0258 — h2 0.3.27 accepts unbounded empty DATA
    # frames (low severity). Via aws-smithy-http-client 1.5.2, already
    # at latest; the AWS SDK's smithy client still ships h2 0.3
    # alongside 0.4. Remove when the AWS SDK drops h2 0.3.
    "RUSTSEC-2026-0258",
    # RUSTSEC-2026-0346 / -0349 — rustls 0.21.12 (Debug impls leak TLS
    # session secrets; unauthenticated ServerHello can downgrade key
    # exchange). Via aws-smithy-http-client 1.5.2, already at latest;
    # the AWS SDK still pins rustls 0.21. The S3 client only talks to
    # the operator-configured S3 endpoint, and the code never Debug-
    # prints a TLS session — bounded exposure. Remove when the AWS SDK
    # moves its smithy client to rustls 0.23+.
    "RUSTSEC-2026-0346",
    "RUSTSEC-2026-0349",
    # RUSTSEC-2026-0098 / -0099 / -0104 / -0382 — rustls-webpki
    # 0.101.7 (name-constraint and CRL parsing issues, via rustls
    # 0.21.12 above). Same removal condition: AWS SDK on rustls 0.23+.
    "RUSTSEC-2026-0098",
    "RUSTSEC-2026-0099",
    "RUSTSEC-2026-0104",
    "RUSTSEC-2026-0382",
]

[licenses]
# Allow-list (spec: Apache / MIT / BSD / ISC / Unicode / MPL-2.0 / Zlib).
allow = [
    "Apache-2.0",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "MPL-2.0",
    "Zlib",
]
# Warn on allow-listed licenses that no crate in the tree actually uses,
# so the list stays honest as dependencies change.
unused-allowed-license = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
