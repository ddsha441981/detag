# cargo-deny configuration (P0-007, NFR-52). cargo-deny 0.20.2.
#
# Policy:
# - Advisories: RUSTSEC vulnerability advisories are errors (cargo-deny
#   0.20 has no severity knob for them — they always fail `check` unless
#   listed in `ignore` with a reason). Yanked crates are denied.
#   Unsound advisories likewise always error in 0.20 — the `unsound`
#   key was REMOVED upstream (EmbarkStudios/cargo-deny#611) and its
#   presence is now a config error, so there is no line for it here;
#   removing it does not weaken anything (it errors for every crate
#   now, where the old line scoped it to workspace crates only).
#   Unmaintained advisories error for every crate in the graph.
# - Licenses: only the permissive set in `allow` is accepted. cargo-deny
#   denies any license not in `allow` by default, so server-side copyleft
#   (AGPL) is denied without needing an explicit list. A crate
#   dual-licensed "X OR Y" passes when any one of its licenses is allowed.
# - Sources: only crates.io; a git dependency needs an explicit exception
#   (add it here with a comment + ADR) — none exist today.
#
# Run locally: `just deny` (or `cargo deny check`).

[advisories]
# Yanked crates must not enter the tree.
yanked = "deny"
# Unmaintained advisories error for every crate in the graph (upstream
# default scope). If one fires on a transitive crate we cannot fix, add
# its id to `ignore` below with a reason — do not weaken this.
unmaintained = "all"
# (No `unsound` line: removed upstream in cargo-deny#611 — unsound
# advisories always error in 0.20, which is stricter than the old
# `unsound = "workspace"` line. See the header comment.)
# Ignored advisories (each needs a reason). Every entry below is a
# transitive crate with NO upgrade path at the latest ecosystem
# version on 13 Nov 2026 — verified by updating the parent to latest
# (aws-sdk-s3 1.159.0, testcontainers 0.28.0, image 0.25.10) and
# re-running `cargo deny check`. A new advisory on any crate — or a
# new version of any of these crates — still fails the build; these
# ignores are pinned to the advisory IDs, not the crates. Remove an
# entry as soon as its removal condition is met; the weekly audit job
# re-checks the tree every Monday, so a newly available fix surfaces
# within a week.
ignore = [
    # RUSTSEC-2026-0440 — astral-tokio-tar 0.6.4 unmaintained (via
    # testcontainers 0.28.0, dev-only: testkit + api/storage dev-deps).
    # testcontainers is already at latest (0.28.0); no newer version
    # drops the crate. Remove when testcontainers ships a release
    # without astral-tokio-tar.
    "RUSTSEC-2026-0440",
    # RUSTSEC-2024-0436 — paste 1.0.15 unmaintained (via image 0.25.10
    # -> ravif 0.13.0 -> rav1e 0.8.1; dev-only: engine benches).
    # image is already at latest 0.25.10. paste has no known
    # vulnerability — unmaintained only. Remove when image's ravif
    # chain stops depending on paste.
    "RUSTSEC-2024-0436",
    # RUSTSEC-2026-0258 — h2 0.3.27 accepts unbounded empty DATA
    # frames (low severity). Via aws-smithy-http-client 1.5.2, already
    # at latest; the AWS SDK's smithy client still ships h2 0.3
    # alongside 0.4. Remove when the AWS SDK drops h2 0.3.
    "RUSTSEC-2026-0258",
    # RUSTSEC-2026-0346 / -0349 — rustls 0.21.12 (Debug impls leak TLS
    # session secrets; unauthenticated ServerHello can downgrade key
    # exchange). Via aws-smithy-http-client 1.5.2, already at latest;
    # the AWS SDK still pins rustls 0.21. The S3 client only talks to
    # the operator-configured S3 endpoint, and the code never Debug-
    # prints a TLS session — bounded exposure. Remove when the AWS SDK
    # moves its smithy client to rustls 0.23+.
    "RUSTSEC-2026-0346",
    "RUSTSEC-2026-0349",
    # RUSTSEC-2026-0098 / -0099 / -0104 / -0382 — rustls-webpki
    # 0.101.7 (name-constraint and CRL parsing issues, via rustls
    # 0.21.12 above). Same removal condition: AWS SDK on rustls 0.23+.
    "RUSTSEC-2026-0098",
    "RUSTSEC-2026-0099",
    "RUSTSEC-2026-0104",
    "RUSTSEC-2026-0382",
    # RUSTSEC-2026-0174 — http-types 2.12.0 notice (Authorization /
    # WwwAuthenticate values can violate ASCII invariants; the crate
    # is unmaintained, no fix coming). Via async-stripe 0.41.0
    # (P1-060) — the adapter never builds Authorization headers
    # through http-types itself. Verified 2026-11-16: no upgrade path
    # at the latest ecosystem version. Remove when async-stripe drops
    # http-types.
    "RUSTSEC-2026-0174",
    # RUSTSEC-2024-0384 — instant 0.1.13 unmaintained (author points
    # to web-time; no upgrade path). Via fastrand -> futures-lite ->
    # http-types -> async-stripe 0.41.0 (P1-060). Unmaintained only,
    # no vulnerability. Verified 2026-11-16. Remove when
    # async-stripe's http-types chain stops depending on instant.
    "RUSTSEC-2024-0384",
    # RUSTSEC-2026-0381 — webpki-roots 0.25.4 bundles the distrusted
    # emSign ECC Root CA - G3 (its intermediate private keys are now
    # well known; a MITM presenting an emSign-intermediate chain
    # could be trusted). Patched only in >= 1.0.10, but hyper-rustls
    # 0.24.2 (via async-stripe 0.41.0's webpki runtime feature,
    # P1-060 — and the AWS smithy client) requires webpki-roots
    # ^0.25, and no patched 0.25.x exists: no upgrade path in this
    # graph. Verified 2026-11-16. Bounded: the store is only used by
    # the Stripe client (api.stripe.com) and the S3 client (operator
    # endpoint), both of which present non-emSign chains. Remove when
    # hyper-rustls 0.24 leaves the tree (async-stripe / AWS SDK move
    # to a webpki-roots 1.x client).
    "RUSTSEC-2026-0381",
    # RUSTSEC-2026-0543 / -0555 / -0559 — chrono 0.4.45, chrono-tz
    # 0.9.0, chrono-tz-build 0.3.0 unmaintained (all versions
    # affected; "No safe upgrade is available!"). Chrono is a DIRECT
    # workspace dependency (api, billing, core, mailer, storage, gc,
    # worker) and enters transitively via tera 1.20.1 -> chrono-tz
    # (mailer templates), sqlx (chrono feature), async-stripe /
    # apalis. The advisory names jiff/time as alternatives — swapping
    # chrono workspace-wide is a migration, not a patch. Verified
    # 2026-11-17 (CI-FAIL-024, found during P1-064's checks): the
    # failure is a newly published advisory against an unchanged tree
    # (no Cargo.toml/Cargo.lock change in the P1-064 tree). Remove
    # when the workspace migrates off chrono (jiff/time) or tera
    # ships a release without chrono-tz.
    "RUSTSEC-2026-0543",
    "RUSTSEC-2026-0555",
    "RUSTSEC-2026-0559",
]

[licenses]
# Allow-list (spec: Apache / MIT / BSD / ISC / Unicode / MPL-2.0 / Zlib,
# plus the three permissive licenses the mailer + S3 chains need —
# CI-FAIL-018: all three are OSI-approved / permissive — and NCSA,
# CI-FAIL-033: libfuzzer-sys (rav1e/ravif/image avif chain) is licensed
# "(MIT OR Apache-2.0) AND NCSA"; the AND forces NCSA to be allowed too.
# NCSA is OSI-approved and FSF-free, same permissive class as BSD/MIT).
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "MPL-2.0",
    "Zlib",
    "CDLA-Permissive-2.0",
    "NCSA",
]
# Warn on allow-listed licenses that no crate in the tree actually uses,
# so the list stays honest as dependencies change.
unused-allowed-license = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
