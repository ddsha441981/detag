# Postgres for local dev (P0-034, E0.4).
#
# This is the ONLY compose file until E0.9 (P0-085) folds this service
# into compose.base.yml alongside api, worker, redis and minio. It
# exists now because the sqlx tickets (P0-035+) need a real database.
#
#   docker compose -f ops/compose.db.yml --env-file .env up -d --wait
#   docker compose -f ops/compose.db.yml down        # keeps the data
#   docker compose -f ops/compose.db.yml down -v     # wipes the data
#
# Notes:
# - `network_mode: host` (ADR-0014): this VM has no bridge networking
#   (dockerd runs with "bridge": "none"), so there is no `ports:`
#   mapping — postgres listens on the host's 5432 directly.
# - Credentials come from .env (PF_POSTGRES_*, dev defaults pf/pf/pf
#   in .env.example) and must match PF_DATABASE_URL. No literal
#   secrets in this file.
# - The healthcheck uses the container's own POSTGRES_* env
#   ($${...} escapes compose interpolation so the shell inside the
#   container expands it). `--wait` blocks until it reports healthy.
# - Named volume `detag_pgdata` survives `down`; only `down -v`
#   removes it (P0-034 AC: volume persists).
name: detag-db

services:
  postgres:
    image: postgres:16-alpine
    container_name: detag-postgres
    network_mode: host
    environment:
      POSTGRES_USER: ${PF_POSTGRES_USER:-pf}
      POSTGRES_PASSWORD: ${PF_POSTGRES_PASSWORD:-pf}
      POSTGRES_DB: ${PF_POSTGRES_DB:-pf}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER:-pf} -d $${POSTGRES_DB:-pf}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  pgdata:
    name: detag_pgdata
