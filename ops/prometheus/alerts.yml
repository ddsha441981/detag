# Alert rules (P0-031, NFR-62). Thresholds per the runbook
# (docs/06-DELIVERY/03-deploy-runbook.md, Observability section).
#
# Only rules whose series exist today are active. The runbook's
# remaining alerts are listed as commented rules below with the
# series and landing ticket — they are NOT active rules, because a
# rule over a nonexistent series evaluates to no data and would
# silently never fire. Uncomment each one in the ticket that
# registers its series.

groups:
  - name: detag-api
    rules:
      # Runbook: "readyz fail > 2 min". There is no /readyz probe
      # series yet (the endpoint lands with the API spec), so the
      # scrape health `up` is the proxy: if Prometheus cannot scrape
      # the api's /metrics for 2 minutes, the api is down or its
      # metrics port is blocked.
      - alert: DetagApiDown
        expr: up{job="detag-api"} == 0
        for: 2m
        labels:
          severity: page
        annotations:
          summary: Detag API scrape down for 2m
          description: >-
            Prometheus cannot reach the detag-api /metrics endpoint.
            The api is down, or its metrics port (PF_METRICS_PORT,
            default 9090) is blocked. Check `docker compose ps` and
            the api logs; the /readyz endpoint reports db/redis/
            storage/model health once it lands.

      # Runbook: "error rate" (job failure > 5%/15 min is the job
      # analogue, pending below). API 5xx share above 5% for 5m.
      - alert: DetagApiHighErrorRate
        expr: |
          sum(rate(detag_http_requests_total{status=~"5.."}[5m]))
            / sum(rate(detag_http_requests_total[5m])) > 0.05
        for: 5m
        labels:
          severity: page
        annotations:
          summary: Detag API 5xx share above 5% for 5m
          description: >-
            More than 5% of API requests return 5xx. Check the api
            logs and the api-golden dashboard (error rate panel);
            likely causes are a down dependency (db/redis/storage)
            or a bad deploy.

